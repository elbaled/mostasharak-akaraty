<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - إضافة عقار | مستشارك العقاري</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Tahoma, sans-serif;
    }

    body {
      background: #f5f7fa;
      color: #172033;
      padding: 20px;
    }

    .container {
      max-width: 650px;
      margin: auto;
      background: white;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }

    .header-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      border-bottom: 1px solid #eee;
      padding-bottom: 15px;
    }

    .header-flex h1 {
      font-size: 22px;
      color: #071b35;
    }

    .back-btn {
      background: #f0f2f5;
      color: #333;
      padding: 8px 14px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 13px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 14px;
      color: #333;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      background: #fafafa;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #123b68;
      background: white;
    }

    textarea {
      resize: vertical;
      height: 100px;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .submit-btn {
      width: 100%;
      background: #d6a84f;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }

    .submit-btn:hover {
      background: #b48732;
    }

    #msg {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="header-flex">
      <h1>🏠 إضافة عقار جديد</h1>
      <a href="index.html" class="back-btn">← الرئيسية</a>
    </div>

    <form id="addPropertyForm">
      
      <div class="form-group">
        <label>عنوان العقار (مثال: شقة مميزة للبيع)</label>
        <input type="text" id="title" required placeholder="أدخل عنواناً جذاباً للعقار">
      </div>

      <div class="row">
        <div class="form-group">
          <label>السعر (بالجنيه)</label>
          <input type="number" id="price" required placeholder="2500000">
        </div>
        <div class="form-group">
          <label>المدينة</label>
          <select id="city">
            <option value="مدينة بدر">مدينة بدر</option>
            <option value="العاصمة الإدارية">العاصمة الإدارية</option>
            <option value="الشروق">الشروق</option>
            <option value="المدن الجديدة">المدن الجديدة</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="form-group">
          <label>الحي / الموقع الفرعي</label>
          <input type="text" id="location" placeholder="الحي المتميز، المنطقة الأولى...">
        </div>
        <div class="form-group">
          <label>المساحة (م²)</label>
          <input type="number" id="area" placeholder="150">
        </div>
      </div>

      <div class="row">
        <div class="form-group">
          <label>عدد غرف النوم</label>
          <input type="number" id="bedrooms" placeholder="3">
        </div>
        <div class="form-group">
          <label>عدد الحمامات</label>
          <input type="number" id="bathrooms" placeholder="2">
        </div>
      </div>

      <div class="row">
        <div class="form-group">
          <label>الدور</label>
          <input type="text" id="floor" placeholder="الرابع / الأرضي">
        </div>
        <div class="form-group">
          <label>الرابط المباشر للصورة (من ImgBB)</label>
          <input type="url" id="image" placeholder="https://i.ibb.co/xxxx/image.jpg">
        </div>
      </div>

      <div class="form-group">
        <label>وصف تفصيلي للعقار</label>
        <textarea id="description" placeholder="اكتب تفاصيل التشطيب والمميزات والقرب من الخدمات..."></textarea>
      </div>

      <button type="submit" class="submit-btn" id="saveBtn">حفظ ونشر العقار 🚀</button>

    </form>

    <div id="msg"></div>

  </div>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.1/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/12.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBnyFEgU-LQggS5kKceH3_WeAaBsYzwqLo",
      authDomain: "mostasharak-akaraty.firebaseapp.com",
      databaseURL: "https://mostasharak-akaraty-default-rtdb.firebaseio.com",
      projectId: "mostasharak-akaraty",
      storageBucket: "mostasharak-akaraty.firebasestorage.app",
      messagingSenderId: "287363939919",
      appId: "1:287363939919:web:e53f13b518c6273043f43a",
      measurementId: "G-QK6EW9G8CB"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    const form = document.getElementById("addPropertyForm");
    const saveBtn = document.getElementById("saveBtn");
    const msg = document.getElementById("msg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      saveBtn.disabled = true;
      saveBtn.textContent = "جاري الحفظ والنشر...";

      const propertyData = {
        title: document.getElementById("title").value,
        price: document.getElementById("price").value,
        city: document.getElementById("city").value,
        location: document.getElementById("location").value,
        area: document.getElementById("area").value,
        bedrooms: document.getElementById("bedrooms").value,
        bathrooms: document.getElementById("bathrooms").value,
        floor: document.getElementById("floor").value,
        image: document.getElementById("image").value,
        description: document.getElementById("description").value,
        featured: true,
        createdAt: Date.now()
      };

      try {
        // رفع البيانات لقاعدة البيانات تحت قسم properties
        const propertiesRef = ref(database, "properties");
        await push(propertiesRef, propertyData);

        msg.style.display = "block";
        msg.style.background = "#e7f7ed";
        msg.style.color = "#16723a";
        msg.textContent = "تم إضافة ونشر العقار بنجاح! 🎉";

        form.reset();
        saveBtn.disabled = false;
        saveBtn.textContent = "حفظ ونشر العقار 🚀";

        // الانتقال للرئيسية بعد ثانيتين
        setTimeout(() => {
          window.location.href = "index.html";
        }, 2000);

      } catch (error) {
        console.error(error);
        msg.style.display = "block";
        msg.style.background = "#ffe7e7";
        msg.style.color = "#b42318";
        msg.textContent = "حدث خطأ أثناء الحفظ، حاول مرة أخرى.";
        saveBtn.disabled = false;
        saveBtn.textContent = "حفظ ونشر العقار 🚀";
      }
    });
  </script>

</body>
</html>
