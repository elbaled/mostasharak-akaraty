<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم الشاملة | مستشارك العقاري</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Tahoma, sans-serif;
    }

    body {
      background: #f5f7fa;
      color: #172033;
      padding-bottom: 50px;
    }

    header {
      background: linear-gradient(135deg, #071b35, #123b68);
      color: white;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 0 0 20px 20px;
    }

    header h1 {
      font-size: 20px;
    }

    .nav-links {
      display: flex;
      gap: 10px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: white;
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      text-decoration: none;
    }

    .btn-danger {
      background: #d9534f;
    }

    .container {
      max-width: 800px;
      margin: 25px auto;
      padding: 0 16px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 18px;
      color: #071b35;
      margin-bottom: 18px;
      border-right: 4px solid #d6a84f;
      padding-right: 10px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 13px;
      color: #444;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 11px;
      font-size: 14px;
      outline: none;
      background: #fafafa;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #123b68;
      background: white;
    }

    textarea {
      resize: vertical;
      height: 90px;
    }

    .row-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .submit-btn {
      width: 100%;
      background: #123b68;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit-btn:hover {
      background: #071b35;
    }

    /* قائمة العقارات الحالية وحذفها */
    .property-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fafafa;
      padding: 12px 15px;
      border-radius: 12px;
      margin-bottom: 10px;
      border: 1px solid #eee;
    }

    .property-info-admin h4 {
      font-size: 15px;
      color: #071b35;
      margin-bottom: 4px;
    }

    .property-info-admin p {
      font-size: 12px;
      color: #777;
    }

    .delete-btn {
      background: #fee2e2;
      color: #b91c1c;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .delete-btn:hover {
      background: #fecaca;
    }
  </style>
</head>
<body>

  <header>
    <h1>لوحة التحكم - مستشارك العقاري</h1>
    <div class="nav-links">
      <a href="index.html" class="btn">🏠 الرئيسية</a>
      <button class="btn btn-danger" id="logoutBtn">تسجيل الخروج</button>
    </div>
  </header>

  <div class="container">
    
    <!-- قسم إضافة عقار جديد -->
    <div class="card">
      <h2>➕ إضافة عقار جديد للموقع</h2>

      <form id="addPropertyForm">
        <div class="form-group">
          <label>عنوان العقار</label>
          <input type="text" id="propTitle" required placeholder="مثال: شقة مميزة للبيع في الحي المتميز">
        </div>

        <div class="row-grid">
          <div class="form-group">
            <label>المدينة</label>
            <select id="propCity">
              <option value="مدينة بدر">مدينة بدر</option>
              <option value="العاصمة الإدارية">العاصمة الإدارية</option>
              <option value="الشروق">الشروق</option>
              <option value="المدن الجديدة">المدن الجديدة</option>
            </select>
          </div>
          <div class="form-group">
            <label>الحي / الموقع الفرعي</label>
            <input type="text" id="propLocation" placeholder="مثال: الحي المتميز">
          </div>
        </div>

        <div class="row-grid">
          <div class="form-group">
            <label>السعر (بالجنيه)</label>
            <input type="number" id="propPrice" required placeholder="2500000">
          </div>
          <div class="form-group">
            <label>المساحة (م²)</label>
            <input type="number" id="propArea" placeholder="150">
          </div>
        </div>

        <div class="row-grid">
          <div class="form-group">
            <label>غرف النوم</label>
            <input type="number" id="propRooms" placeholder="3">
          </div>
          <div class="form-group">
            <label>الحمامات</label>
            <input type="number" id="propBathrooms" placeholder="2">
          </div>
        </div>

        <div class="form-group">
          <label>رابط الصورة المباشر (من ImgBB)</label>
          <input type="url" id="propImage" placeholder="https://i.ibb.co/... أو اتركه فارغاً للصورة الافتراضية">
        </div>

        <div class="form-group">
          <label>وصف العقار</label>
          <textarea id="propDescription" placeholder="تفاصيل التشطيب والمميزات..."></textarea>
        </div>

        <button type="submit" class="submit-btn" id="saveBtn">حفظ ونشر العقار 🚀</button>
      </form>
    </div>

    <!-- قسم إدارة وحذف العقارات الحالية -->
    <div class="card">
      <h2> إدارة العقارات المعروضة (حذف وتعديل)</h2>
      <div id="adminPropertyList">
        <p style="text-align:center; color:#777;">جاري تحميل العقارات...</p>
      </div>
    </div>

  </div>

  <!-- Firebase Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.1/firebase-app.js";
    import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/12.7.1/firebase-auth.js";
    import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/12.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBnyFEgU-LQggS5kKceH3_WeAaBsYzwqLo",
      authDomain: "mostasharak-akaraty.firebaseapp.com",
      databaseURL: "https://mostasharak-akaraty-default-rtdb.firebaseio.com",
      projectId: "mostasharak-akaraty",
      storageBucket: "mostasharak-akaraty.firebasestorage.app",
      messagingSenderId: "287363939919",
      appId: "1:287363939919:web:e53f13b518c6273043f43a",
      measurementId: "G-QK6EW9G8CB"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    // تسجيل الخروج
    document.getElementById("logoutBtn").addEventListener("click", () => {
      signOut(auth).then(() => {
        window.location.href = "admin-login.html";
      });
    });

    // 1. إضافة عقار جديد
    const form = document.getElementById("addPropertyForm");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const saveBtn = document.getElementById("saveBtn");
      saveBtn.disabled = true;
      saveBtn.textContent = "جاري الحفظ...";

      const newProp = {
        title: document.getElementById("propTitle").value,
        city: document.getElementById("propCity").value,
        location: document.getElementById("propLocation").value,
        price: Number(document.getElementById("propPrice").value),
        area: document.getElementById("propArea").value,
        bedrooms: document.getElementById("propRooms").value,
        bathrooms: document.getElementById("propBathrooms").value,
        image: document.getElementById("propImage").value || "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=900&q=80",
        description: document.getElementById("propDescription").value,
        createdAt: Date.now()
      };

      try {
        await push(ref(database, "properties"), newProp);
        alert("تم إضافة العقار ونشره بنجاح! 🎉");
        form.reset();
      } catch (err) {
        alert("حدث خطأ أثناء الحفظ.");
        console.error(err);
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "حفظ ونشر العقار 🚀";
      }
    });

    // 2. عرض العقارات وقائمة التحكم (للحذف)
    const propertyListContainer = document.getElementById("adminPropertyList");
    const propertiesRef = ref(database, "properties");

    onValue(propertiesRef, (snapshot) => {
      const data = snapshot.val();
      propertyListContainer.innerHTML = "";

      if (!data) {
        propertyListContainer.innerHTML = "<p style='text-align:center; color:#777;'>لا توجد عقارات مضافة حالياً.</p>";
        return;
      }

      Object.entries(data).forEach(([id, prop]) => {
        const item = document.createElement("div");
        item.className = "property-item";

        item.innerHTML = `
          <div class="property-info-admin">
            <h4>${prop.title || "عقار بدون عنوان"}</h4>
            <p>📍 ${prop.city || ""} - 💰 ${Number(prop.price || 0).toLocaleString()} جنيه</p>
          </div>
          <button class="delete-btn" onclick="deleteProperty('${id}')">حذف 🗑️</button>
        `;

        propertyListContainer.appendChild(item);
      });
    });

    // 3. دالة حذف العقار
    window.deleteProperty = async function(id) {
      if (confirm("هل أنت متأكد من رغبتك في حذف هذا العقار نهائياً؟")) {
        try {
          await remove(ref(database, `properties/${id}`));
          alert("تم حذف العقار بنجاح.");
        } catch (err) {
          alert("حدث خطأ أثناء الحذف.");
          console.error(err);
        }
      }
    };
  </script>

</body>
</html>
