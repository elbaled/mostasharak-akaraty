<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دخول الإدارة | مستشارك العقاري</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Tahoma, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #071b35, #123b68);
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: #fff;
      padding: 30px 22px;
      border-radius: 24px;
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
    }

    .logo {
      width: 75px;
      height: 75px;
      margin: 0 auto 15px;
      border-radius: 20px;
      background: #d6a84f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }

    h1 {
      text-align: center;
      color: #071b35;
      margin: 0;
      font-size: 25px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin: 8px 0 28px;
      font-size: 14px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #172033;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      direction: ltr;
    }

    input:focus {
      border-color: #123b68;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      background: #123b68;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    #message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
      display: none;
    }

    .success {
      display: block !important;
      background: #e7f7ed;
      color: #16723a;
    }

    .error {
      display: block !important;
      background: #ffe7e7;
      color: #b42318;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #123b68;
      text-decoration: none;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">🏠</div>

    <h1>مستشارك العقاري</h1>

    <div class="subtitle">
      تسجيل دخول الإدارة 🔐
    </div>

    <form id="loginForm">

      <div class="input-group">

        <label for="email">
          البريد الإلكتروني
        </label>

        <input
          type="email"
          id="email"
          placeholder="admin@example.com"
          required
        >

      </div>

      <div class="input-group">

        <label for="password">
          كلمة المرور
        </label>

        <input
          type="password"
          id="password"
          placeholder="كلمة المرور"
          required
        >

      </div>

      <button id="loginBtn" type="submit">
        🔐 تسجيل الدخول
      </button>

    </form>

    <div id="message"></div>

    <a class="back" href="index.html">
      ← العودة للموقع
    </a>

  </div>


  <!-- Firebase -->

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword
    }
      from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";


    const firebaseConfig = {

      apiKey: "AIzaSyBnyFEgU-LQggS5kKceH3_WeAaBsYzwqLo",

      authDomain:
        "mostasharak-akaraty.firebaseapp.com",

      databaseURL:
        "https://mostasharak-akaraty-default-rtdb.firebaseio.com",

      projectId:
        "mostasharak-akaraty",

      storageBucket:
        "mostasharak-akaraty.firebasestorage.app",

      messagingSenderId:
        "287363939919",

      appId:
        "1:287363939919:web:e53f13b518c6273043f43a",

      measurementId:
        "G-QK6EW9G8CB"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    const loginForm =
      document.getElementById("loginForm");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginBtn =
      document.getElementById("loginBtn");

    const message =
      document.getElementById("message");


    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        message.style.display = "none";
        message.className = "";
        message.textContent = "";


        loginBtn.disabled = true;
        loginBtn.textContent =
          "جاري تسجيل الدخول...";


        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        try {

          const userCredential =
            await signInWithEmailAndPassword(
              auth,
              email,
              password
            );


          console.log(
            "تم تسجيل الدخول:",
            userCredential.user.email
          );


          message.textContent =
            "تم تسجيل الدخول بنجاح ✅";

          message.className =
            "success";


          loginBtn.disabled = false;

          loginBtn.textContent =
            "تم تسجيل الدخول ✅";


        } catch (error) {

          console.error(
            "Firebase Error:",
            error
          );


          let text =
            "حدث خطأ أثناء تسجيل الدخول.";


          if (
            error.code ===
            "auth/invalid-credential"
          ) {

            text =
              "الإيميل أو كلمة المرور غير صحيحة.";

          } else if (
            error.code ===
            "auth/invalid-email"
          ) {

            text =
              "البريد الإلكتروني غير صحيح.";

          } else if (
            error.code ===
            "auth/user-disabled"
          ) {

            text =
              "هذا الحساب تم تعطيله.";

          } else if (
            error.code ===
            "auth/too-many-requests"
          ) {

            text =
              "تم إيقاف المحاولات مؤقتًا. حاول لاحقًا.";

          } else if (
            error.code ===
            "auth/operation-not-allowed"
          ) {

            text =
              "تسجيل الدخول بالبريد الإلكتروني غير مفعل في Firebase.";

          }


          message.textContent =
            text + " [" + error.code + "]";

          message.className =
            "error";


          loginBtn.disabled = false;

          loginBtn.textContent =
            "🔐 تسجيل الدخول";

        }

      }

    );

  </script>

</body>

</html>
