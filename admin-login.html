<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>دخول الإدارة - مستشارك العقاري</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Tahoma, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #071b35, #123b68);
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px 22px;
      border-radius: 22px;
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
    }

    .logo {
      text-align: center;
      font-size: 50px;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      color: #071b35;
      margin: 0 0 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #172033;
      font-size: 13px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 17px;
      border: 1px solid #ddd;
      border-radius: 11px;
      font-size: 14px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 11px;
      background: #123b68;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    #message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-size: 13px;
      line-height: 1.6;
    }

    .success {
      display: block !important;
      background: #e7f7ed;
      color: #16723a;
    }

    .error {
      display: block !important;
      background: #ffe7e7;
      color: #b42318;
    }
  </style>
</head>


<body>

  <div class="box">

    <div class="logo">🏠</div>

    <h1>مستشارك العقاري</h1>

    <div class="subtitle">
      تسجيل دخول الإدارة
    </div>


    <form id="loginForm">

      <label>
        البريد الإلكتروني
      </label>

      <input
        type="email"
        id="email"
        placeholder="admin@example.com"
        required
      >


      <label>
        كلمة المرور
      </label>

      <input
        type="password"
        id="password"
        placeholder="كلمة المرور"
        required
      >


      <button id="loginBtn" type="submit">
        🔐 تسجيل الدخول
      </button>

    </form>


    <div id="message"></div>

  </div>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.7.1/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword
    }
      from "https://www.gstatic.com/firebasejs/12.7.1/firebase-auth.js";


    const firebaseConfig = {

      apiKey: "AIzaSyBnyFEgU-LQggS5kKceH3_WeAaBsYzwqLo",

      authDomain:
        "mostasharak-akaraty.firebaseapp.com",

      databaseURL:
        "https://mostasharak-akaraty-default-rtdb.firebaseio.com",

      projectId:
        "mostasharak-akaraty",

      storageBucket:
        "mostasharak-akaraty.firebasestorage.app",

      messagingSenderId:
        "287363939919",

      appId:
        "1:287363939919:web:e53f13b518c6273043f43a",

      measurementId:
        "G-QK6EW9G8CB"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    const form =
      document.getElementById("loginForm");

    const email =
      document.getElementById("email");

    const password =
      document.getElementById("password");

    const button =
      document.getElementById("loginBtn");

    const message =
      document.getElementById("message");


    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      message.className = "";
      message.style.display = "none";
      message.textContent = "";

      button.disabled = true;
      button.textContent = "جاري التحقق...";


      try {

        const result =
          await signInWithEmailAndPassword(
            auth,
            email.value.trim(),
            password.value
          );


        console.log(
          "Firebase login:",
          result.user.email
        );


        message.textContent =
          "تم تسجيل الدخول بنجاح ✅";

        message.className =
          "success";


        button.disabled = false;
        button.textContent =
          "تم الدخول بنجاح";


      } catch (error) {

        console.error(
          "Firebase Error:",
          error
        );


        let errorMessage =
          "حدث خطأ أثناء تسجيل الدخول.";


        if (
          error.code ===
          "auth/invalid-credential"
        ) {

          errorMessage =
            "الإيميل أو كلمة المرور غير صحيحة.";

        }

        else if (
          error.code ===
          "auth/user-not-found"
        ) {

          errorMessage =
            "هذا الحساب غير موجود.";

        }

        else if (
          error.code ===
          "auth/wrong-password"
        ) {

          errorMessage =
            "كلمة المرور غير صحيحة.";

        }

        else if (
          error.code ===
          "auth/invalid-email"
        ) {

          errorMessage =
            "صيغة البريد الإلكتروني غير صحيحة.";

        }

        else if (
          error.code ===
          "auth/operation-not-allowed"
        ) {

          errorMessage =
            "تسجيل الدخول بالإيميل غير مفعل في Firebase.";

        }


        message.textContent =
          errorMessage +
          " (" + error.code + ")";

        message.className =
          "error";


        button.disabled = false;
        button.textContent =
          "🔐 تسجيل الدخول";

      }

    });

  </script>

</body>
</html>
